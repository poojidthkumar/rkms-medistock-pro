[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rkms-medistock-pro"
version = "1.0.0"
description = "RKMS MediStock Pro - hostel medical stock management system"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "bcrypt",
    "python-jose[cryptography]",
    "python-multipart",
]

[project.scripts]
rkms-medistock = "rkms_medistock_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rkms_medistock_pro = ["app.html"]
